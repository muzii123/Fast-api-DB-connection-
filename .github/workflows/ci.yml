name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  code-quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black pytest httpx
        if (Test-Path requirements.txt) {
          pip install -r requirements.txt
        } else {
          echo "requirements.txt not found, installing common packages"
          pip install fastapi uvicorn sqlalchemy psycopg2-binary alembic
        }
    
    - name: Check code formatting with Black
      run: black --check . || echo "Formatting issues found (non-blocking)"
      continue-on-error: true
    
    - name: Lint with Flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true
    
    - name: Run tests with pytest
      run: pytest -v || echo "No tests found or tests failed"
      continue-on-error: true

 
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build Docker image
      run: docker build -t cart-api:test .
    
    - name: Verify Docker image
      run: docker images cart-api:test