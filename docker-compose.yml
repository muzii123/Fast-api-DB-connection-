version: '3.8'

services:
  db:
    image: postgres:15
    container_name: cart_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: cartdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No ports exposed to host — app containers connect internally via Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-blue:
    build: .
    container_name: cart_fastapi_blue
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password123@db:5432/cartdb
      SECRET_KEY: a7f3c9e2b84d1f6a0e5b2c8d4f7a1e9b3c6d0f2a5e8b1c4d7f0a3e6b9c2d5f8
    depends_on:
      db:
        condition: service_healthy

  app-green:
    build: .
    container_name: cart_fastapi_green
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password123@db:5432/cartdb
      SECRET_KEY: a7f3c9e2b84d1f6a0e5b2c8d4f7a1e9b3c6d0f2a5e8b1c4d7f0a3e6b9c2d5f8
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
