version: '3.8'

services:
  db:
    image: postgres:15
    container_name: cart_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: cartdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-blue:
    build: .
    container_name: cart_fastapi_blue
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password123@db:5432/cartdb
    depends_on:
      db:
        condition: service_healthy

  app-green:
    build: .
    container_name: cart_fastapi_green
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password123@db:5432/cartdb
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
